<style>

html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;background:transparent;min-height:100vh;padding-bottom:calc(104px + env(safe-area-inset-bottom))}

 radial-gradient(55% 40% at 95% 28%,rgba(217,70,239,.45),transparent 70%),
 radial-gradient(70% 50% at 20% 92%,rgba(79,70,229,.6),transparent 70%),

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(255,255,255,.07),transparent 40%)}
header{position:sticky;top:0;margin:0;background:linear-gradient(180deg,rgba(20,8,48,.62),rgba(20,8,48,.28));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.05) inset;z-index:5}
header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#d8c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{padding:14px 14px 0;max-width:720px;margin:0 auto}
.card{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 10px 32px rgba(6,0,24,.45),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.14) 0%,transparent 35%)}
.card>*{position:relative}
.card h2{margin:0 0 10px;font-size:17px;font-weight:650;letter-spacing:-.01em}
.card h3{margin:12px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;background:rgba(10,4,28,.42);color:var(--text);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 12px;font-size:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.25);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:rgba(196,181,253,.8);box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 0 0 3px rgba(167,139,250,.28)}
input::placeholder,textarea::placeholder{color:rgba(179,166,214,.55)}
textarea{min-height:60px}
button{background:linear-gradient(180deg,#b79cff,#7c4dff);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:11px 15px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(124,77,255,.45),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 1px rgba(40,10,100,.35);transition:transform .12s,filter .12s}
button:active{transform:scale(.96);filter:brightness(1.1)}
button.sec{background:rgba(255,255,255,.1);color:var(--text);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);text-shadow:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
button.sm{padding:7px 12px;font-size:13px;border-radius:12px}
button.danger{background:linear-gradient(180deg,#fb7185,#e11d48);color:#fff;box-shadow:0 6px 16px rgba(225,29,72,.4),inset 0 1px 0 rgba(255,255,255,.4)}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:560px;margin:0 auto;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.24);border-radius:28px;display:flex;padding:6px;gap:2px;z-index:5;box-shadow:0 14px 40px rgba(6,0,24,.6),inset 0 1px 0 rgba(255,255,255,.4)}

.muted{color:var(--muted);font-size:13px}

svg.chart{width:100%;height:140px;display:block}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.setrow{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{color:var(--muted);font-size:13px;text-align:center}
.chk{width:44px;height:40px;font-size:18px;padding:0}
.chk.done{background:linear-gradient(180deg,#6ee7b7,#10b981);border-color:rgba(255,255,255,.4);box-shadow:0 6px 16px rgba(16,185,129,.4),inset 0 1px 0 rgba(255,255,255,.5)}

.toast.show{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{white-space:nowrap}
details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--acc2)}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{background:rgba(255,255,255,.12);color:var(--text);width:40px;height:40px;border-radius:50%;padding:0;font-size:19px;font-weight:400;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);text-shadow:none}
#updbar{margin-top:8px;background:rgba(52,211,153,.18);border:1px solid rgba(52,211,153,.4);color:#a7f3d0;border-radius:14px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#updbar.hidden{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--muted)}
.good{color:var(--ok)}.badc{color:var(--bad)}
.alert{background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.38);color:#fde68a;border-radius:16px;padding:11px 12px;font-size:14px;margin-bottom:14px;-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.scroll{overflow-x:auto}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,header,nav{background:#1c0f3d}}
</style>

function idade(d){const n=S.perfil.nasc;if(!n)return null;const a=new Date(n+"T12:00:00"),b=new Date(d+"T12:00:00");let i=b.getFullYear()-a.getFullYear();if(b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate()))i--;return i;}

function tmb(d){const med=tmbMedida(d);if(med)return med;const kg=pesoEm(d),cm=+S.perfil.altura,id=idade(d);if(!kg||!cm||id===null)return null;return Math.round(10*kg+6.25*cm-5*id+(S.perfil.sexo==="f"?-161:5));}
function atividadesDoDia(d){
 const a=[];
 S.logs.forEach((l,i)=>{if(l.data===d)a.push({k:"log",i,tipo:"Musculação",nome:l.nome,dur:+l.dur||0,dist:0,kcal:+l.kcal||0,fc:+l.fc||0});});
 S.atividades.forEach((x,i)=>{if(x.data===d)a.push({k:"ativ",i,tipo:x.tipo,nome:x.nome||x.tipo,dur:+x.dur||0,dist:+x.dist||0,kcal:+x.kcal||0,fc:+x.fc||0});});

function gastoDia(d){ // gasto real = total do Garmin; sem ele, estima pelo metabolismo basal
 const x=S.diario[d]||{},tot=+x.kcal||0,at=+x.kcala||0;
 const tr=atividadesDoDia(d).reduce((a,y)=>a+y.kcal,0),t=tmb(d);

}

/* ============ GRÁFICO SVG ============ */
function chart(pts,ref){ // pts: [[date,val]]; ref:[min,max]
 const W=600,H=140,p=28;
 const xs=pts.map(a=>new Date(a[0]).getTime()), ys=pts.map(a=>a[1]);
 let lo=Math.min(...ys),hi=Math.max(...ys);
 if(ref){if(ref[0]!=null)lo=Math.min(lo,ref[0]);if(ref[1]!=null)hi=Math.max(hi,ref[1]);}
 if(hi===lo){hi+=1;lo-=1;} const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
 const x0=Math.min(...xs),x1=Math.max(...xs)||1;
 const X=t=>xs.length>1?p+(t-x0)/(x1-x0)*(W-2*p):W/2, Y=v=>H-p+ (lo-v)/(hi-lo)*(H-2*p)*-1 - (H-2*p);
 const Yv=v=>p+(hi-v)/(hi-lo)*(H-2*p);
 let band="";
 if(ref){const a=ref[0]!=null?Yv(ref[0]):H-p, b=ref[1]!=null?Yv(ref[1]):p; band=`<rect x="${p}" y="${Math.min(a,b)}" width="${W-2*p}" height="${Math.abs(a-b)}" fill="#34d399" opacity=".12"/>`;}
 const path=pts.map((a,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Yv(ys[i]).toFixed(1)).join(" ");
 const dots=pts.map((a,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Yv(ys[i]).toFixed(1)}" r="4" fill="${ref&&fora(ys[i],ref)?"#fb7185":"#c4b5fd"}"/><text x="${X(xs[i]).toFixed(1)}" y="${(Yv(ys[i])-9).toFixed(1)}" font-size="11" fill="#e2e8f0" text-anchor="middle">${ys[i]}</text>`).join("");
 const lbl=pts.map((a,i)=>(i===0||i===pts.length-1)?`<text x="${X(xs[i]).toFixed(1)}" y="${H-6}" font-size="10" fill="#94a3b8" text-anchor="${i===0?"start":"end"}">${a[0].slice(0,7).split("-").reverse().join("/")}</text>`:"").join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${band}<path d="${path}" fill="none" stroke="#c4b5fd" stroke-width="2"/>${dots}${lbl}</svg>`;
}
function fora(v,ref){return (ref[0]!=null&&v<ref[0])||(ref[1]!=null&&v>ref[1]);}
function status(v,ref){if(!ref)return "";if(ref[0]!=null&&v<ref[0])return "lo";if(ref[1]!=null&&v>ref[1])return "hi";return "ok";}

 </div>`;

function exportGarmin(id){
 const t=TREINOS.find(x=>x.id===id);
 const ST={interval:{stepTypeId:3,stepTypeKey:"interval",displayOrder:3},rest:{stepTypeId:5,stepTypeKey:"rest",displayOrder:5},repeat:{stepTypeId:6,stepTypeKey:"repeat",displayOrder:6}};
 const EC={reps:{conditionTypeId:10,conditionTypeKey:"reps",displayOrder:10,displayable:true},time:{conditionTypeId:2,conditionTypeKey:"time",displayOrder:2,displayable:true},iter:{conditionTypeId:7,conditionTypeKey:"iterations",displayOrder:7,displayable:false}};
 const base=()=>({childStepId:1,preferredEndConditionUnit:null,endConditionCompare:null,targetValueOne:null,targetValueTwo:null,targetValueUnit:null,zoneNumber:null,secondaryTargetType:null,secondaryTargetValueOne:null,secondaryTargetValueTwo:null,secondaryTargetValueUnit:null,secondaryZoneNumber:null,endConditionZone:null,strokeType:{strokeTypeId:0,strokeTypeKey:null,displayOrder:0},equipmentType:{equipmentTypeId:0,equipmentTypeKey:null,displayOrder:0},workoutProvider:null,providerExerciseSourceId:null,weightValue:null});
 let order=1,gid=30000000000,k=0;const steps=[];
 t.blocos.forEach(b=>{k++;const g={type:"RepeatGroupDTO",stepId:gid+order,stepOrder:order++,stepType:ST.repeat,childStepId:k,numberOfIterations:b.x,endConditionValue:b.x,preferredEndConditionUnit:null,endConditionCompare:null,endCondition:EC.iter,skipLastRestStep:true,smartRepeat:false,workoutSteps:[]};
  let j=0;b.ex.forEach(e=>{j++;g.workoutSteps.push(Object.assign(base(),{type:"ExecutableStepDTO",stepId:gid+order,stepOrder:order++,childStepId:k,stepType:ST.interval,description:e[0],endCondition:e[4]?EC.time:EC.reps,endConditionValue:e[4]?e[4]:e[3],targetType:{workoutTargetTypeId:1,workoutTargetTypeKey:"no.target",displayOrder:1},category:e[1],exerciseName:e[2],weightUnit:{unitId:8,unitKey:"kilogram",factor:1000}}));});
  j++;g.workoutSteps.push(Object.assign(base(),{type:"ExecutableStepDTO",stepId:gid+order,stepOrder:order++,childStepId:k,stepType:ST.rest,description:"Descanso "+b.r+"s",endCondition:EC.time,endConditionValue:b.r,targetType:null,category:null,exerciseName:null,weightUnit:null}));
  steps.push(g);});
 const sport={sportTypeId:5,sportTypeKey:"strength_training",displayOrder:5};
 const w={workoutId:null,ownerId:null,workoutName:t.nome,description:t.desc,updatedDate:null,createdDate:null,sportType:sport,subSportType:null,trainingPlanId:null,author:null,sharedWithUsers:null,estimatedDurationInSecs:3600,estimatedDistanceInMeters:null,poolLength:null,poolLengthUnit:null,locale:null,workoutProvider:null,workoutSourceId:null,uploadTimestamp:null,atpPlanId:null,consumer:null,consumerName:null,consumerImageURL:null,consumerWebsiteURL:null,workoutNameI18nKey:null,descriptionI18nKey:null,avgTrainingSpeed:0,estimateType:null,estimatedDistanceUnit:{unitId:null,unitKey:null,factor:null},workoutThumbnailUrl:null,isSessionTransitionEnabled:null,shared:false,
  workoutSegments:[{segmentOrder:1,sportType:sport,poolLengthUnit:null,poolLength:null,avgTrainingSpeed:null,estimatedDurationInSecs:null,estimatedDistanceInMeters:null,estimatedDistanceUnit:null,estimateType:null,description:t.nome,workoutSteps:steps}]};
 download(`garmin_${t.id}.json`,JSON.stringify(w),"application/json");
}
function download(name,txt,type){ // mostra o conteúdo com botão Copiar (download direto não funciona em todos os navegadores)
 let box=document.getElementById("dlbox");if(!box){box=document.createElement("div");box.id="dlbox";box.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end";document.body.appendChild(box);}
 box.innerHTML=`<div class="card" style="width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;margin:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))"><h2>${esc(name)}</h2><p class="muted">Toque em Copiar e cole num arquivo com este nome (ou envie para si mesmo). Para o Garmin: salve como .json e importe no Garmin Connect.</p><textarea id="dltxt" style="min-height:120px;font-size:12px;font-family:monospace">${esc(txt)}</textarea><div class="row" style="margin-top:10px">${navigator.share?`<button id="dlshare">Salvar / Enviar</button>`:""}<button id="dlcopy" class="${navigator.share?"sec":""}">Copiar</button><button class="sec" onclick="document.getElementById('dlbox').remove()">Fechar</button></div></div>`;
 const sh=document.getElementById("dlshare");
 if(sh)sh.onclick=async()=>{try{const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else await navigator.share({title:name,text:txt});}catch(e){if(e.name!=="AbortError")toast("Não deu para compartilhar; use Copiar");}};
 document.getElementById("dlcopy").onclick=async()=>{const ta=document.getElementById("dltxt");try{await navigator.clipboard.writeText(txt);toast("Copiado");}catch(e){ta.focus();ta.select();try{document.execCommand("copy");toast("Copiado");}catch(e2){toast("Selecione o texto e copie manualmente");}}};
}

/* ============ COMPOSIÇÃO CORPORAL (bioimpedância) ============ */
function compOrd(){return S.composicao.map((x,i)=>Object.assign({i},x)).sort((a,b)=>a.data.localeCompare(b.data));}
function gordKg(x){return (+x.peso&&+x.gord)?+x.peso*+x.gord/100:null;}
function htmlComposicao(){
 const c=compOrd();const ult=c[c.length-1],pri=c[0];
 const dl=(a,b,inv)=>{if(a==null||b==null)return "–";const d=+(b-a).toFixed(1);const bom=inv?d>0:d<0;return `<span class="${d===0?"":bom?"good":"badc"}">${d>0?"+":""}${fmt1(d)}</span>`;};
 let corpo="";
 if(c.length){
  const gk=gordKg(ult),gk0=gordKg(pri),mk=(+ult.peso&&gk!==null)?ult.peso-gk:null,mk0=(+pri.peso&&gk0!==null)?pri.peso-gk0:null;
  corpo+=`<div class="kpis"><div class="kpi"><div class="l">% gordura</div><div class="v">${ult.gord?fmt1(ult.gord)+"%":"–"}</div><div class="l">${c.length>1?"desde o início: "+dl(+pri.gord||null,+ult.gord||null):""}</div></div>
  <div class="kpi"><div class="l">Massa gorda</div><div class="v">${gk!==null?fmt1(gk)+" kg":"–"}</div><div class="l">${c.length>1?"desde o início: "+dl(gk0,gk):""}</div></div>
  <div class="kpi"><div class="l">Massa sem gordura</div><div class="v">${mk!==null?fmt1(mk)+" kg":"–"}</div><div class="l">${c.length>1?"desde o início: "+dl(mk0,mk,true):""}</div></div>
  <div class="kpi"><div class="l">Metabolismo basal</div><div class="v">${ult.tmb?nf(ult.tmb)+" kcal":"–"}</div><div class="l">${ult.im?"idade metabólica "+ult.im:"medido na bioimpedância"}</div></div></div>`;
  if(c.length>1&&gk!==null&&mk!==null&&gk0!==null&&mk0!==null){const dp=ult.peso-pri.peso,dg=gk-gk0;if(dp<0)corpo+=`<p class="muted" style="margin:8px 0 0">Do peso perdido (${fmt1(-dp)} kg), ${fmt1(Math.max(0,Math.min(100,(-dg/-dp)*100)))}% foi gordura. O ideal é a maior parte vir da gordura, não do músculo.</p>`;}
  const pg=c.filter(x=>+x.gord).map(x=>[x.data,+x.gord]);
  if(pg.length>1)corpo+=`<h3>% de gordura</h3>${chart(pg)}`;
  corpo+=`<div class="scroll" style="margin-top:8px"><table><tr><th>Data</th><th>Peso</th><th>%G</th><th>%Mag.</th><th>Água</th><th>TMB</th><th></th></tr>${c.slice().reverse().map(x=>`<tr><td>${fmtD(x.data).slice(0,5)}/${x.data.slice(2,4)}</td><td>${x.peso||"–"}</td><td>${x.gord||"–"}</td><td>${x.magra||"–"}</td><td>${x.agua||"–"}</td><td>${x.tmb||"–"}</td><td><button class="sec sm" onclick="apagarComp(${x.i})">✕</button></td></tr>`).join("")}</table></div>`;
 }else corpo=`<p class="muted" style="margin:0 0 6px">Registre aqui as medidas da bioimpedância (consulta ou balança). O app mostra a evolução da gordura e usa o seu metabolismo basal medido no balanço de calorias.</p>`;
 return `<div class="card"><h2>Composição corporal</h2>${corpo}
  <details style="margin-top:8px"><summary>＋ Nova medida</summary><div class="grid3" style="margin-top:6px">
   <div><label>Data</label><input id="cp_data" type="date" value="${hoje()}" max="${hoje()}"></div><div><label>Peso (kg)</label><input id="cp_peso" type="number" step="0.1" inputmode="decimal" value="${pesoEm(hoje())||""}"></div><div><label>% gordura</label><input id="cp_gord" type="number" step="0.1" inputmode="decimal"></div>
   <div><label>% massa magra</label><input id="cp_magra" type="number" step="0.1" inputmode="decimal"></div><div><label>% água</label><input id="cp_agua" type="number" step="0.1" inputmode="decimal"></div><div><label>TMB (kcal)</label><input id="cp_tmb" type="number" inputmode="numeric"></div>
   <div><label>Idade metabólica</label><input id="cp_im" type="number" inputmode="numeric"></div></div>
   <p class="muted" style="margin:6px 0 0">Preencha só o que a avaliação trouxe. Peso e % de gordura são os essenciais.</p>
   <div class="row" style="margin-top:8px"><button onclick="addComp()">Salvar medida</button></div></details></div>`;
}
function addComp(){
 const g=id=>document.getElementById(id).value;const peso=+g("cp_peso"),gord=+g("cp_gord"),tmbv=+g("cp_tmb");
 if(!g("cp_data")||(!peso&&!gord&&!tmbv))return toast("Informe a data e ao menos peso, % de gordura ou TMB");
 S.composicao.push({data:g("cp_data"),peso:peso||0,gord:gord||0,magra:+g("cp_magra")||0,agua:+g("cp_agua")||0,tmb:tmbv||0,im:+g("cp_im")||0});
 save();toast("Medida salva ✓");renderKeep();
}
function apagarComp(i){if(!confirm("Apagar esta medida?"))return;S.composicao.splice(i,1);save();renderKeep();}

/* ============ EVOLUÇÃO ============ */
function semanas(){
 const ks=new Set();Object.keys(S.diario).forEach(k=>ks.add(segunda(k)));S.logs.forEach(l=>ks.add(segunda(l.data)));S.atividades.forEach(a=>ks.add(segunda(a.data)));
 return [...ks].sort().map(seg=>{
  const fim=addDias(seg,6);const ds=Object.keys(S.diario).filter(k=>k>=seg&&k<=fim).sort();
  const xs=ds.map(k=>S.diario[k]);
  const pesos=ds.filter(k=>+S.diario[k].peso).map(k=>+S.diario[k].peso);
  const soma=f=>xs.reduce((a,x)=>a+(+x[f]||0),0), cnt=f=>xs.filter(x=>+x[f]).length;
  const ads=xs.map(adesao).filter(a=>a!==null);
  const cint=ds.filter(k=>+S.diario[k].cint).map(k=>+S.diario[k].cint);
  // balanço: só dias fechados (antes de hoje) com consumo e gasto lançados
  let ingS=0,gasS=0,defS=0,defN=0;
  for(let i=0;i<7;i++){const d=addDias(seg,i);if(d>=hoje())break;const ing=ingeridas(d),g=gastoDia(d);
   if(ing!==null&&g){ingS+=ing;gasS+=g.v;defS+=g.v-ing;defN++;}}
  return {seg,fim,peso:pesos.length?pesos[pesos.length-1]:null,cint:cint.length?cint[cint.length-1]:null,
   kcal:soma("kcal"),kcalDias:cnt("kcal"),kcala:soma("kcala"),kcalaDias:cnt("kcala"),passos:soma("passos"),passosDias:cnt("passos"),
   adesao:ads.length?Math.round(ads.reduce((a,b)=>a+b,0)/ads.length):null,diasDieta:ads.length,
   treinos:S.logs.filter(l=>l.data>=seg&&l.data<=fim).length,
   sono:cnt("sono")?(soma("sono")/cnt("sono")).toFixed(1):null,
   defN,defTotal:defS,ing:defN?Math.round(ingS/defN):null,gasto:defN?Math.round(gasS/defN):null,defMedio:defN?Math.round(defS/defN):null,perdaEst:defN?+(defS/KCAL_KG).toFixed(2):null};
 });
}
function barras(vals,labels,cor){
 const W=600,H=140,p=24,max=Math.max(...vals,1),bw=(W-2*p)/vals.length;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${vals.map((v,i)=>{const h=(H-2*p)*v/max;const x=p+i*bw+bw*.15;return `<rect x="${x.toFixed(1)}" y="${(H-p-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${cor}"/>${v?`<text x="${(x+bw*.35).toFixed(1)}" y="${(H-p-h-5).toFixed(1)}" font-size="11" fill="#e2e8f0" text-anchor="middle">${v>=1000?(v/1000).toFixed(1)+"k":v}</text>`:""}<text x="${(x+bw*.35).toFixed(1)}" y="${H-7}" font-size="10" fill="#94a3b8" text-anchor="middle">${labels[i]}</text>`;}).join("")}</svg>`;
}
function barrasDiv(vals,labels){
 const W=600,H=150,p=26,mid=H/2,max=Math.max(...vals.map(Math.abs),1),bw=(W-2*p)/vals.length;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:150px"><line x1="${p}" x2="${W-p}" y1="${mid}" y2="${mid}" stroke="#334155"/>${vals.map((v,i)=>{const h=(mid-p)*Math.abs(v)/max,x=p+i*bw+bw*.15,y=v>=0?mid-h:mid;return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${v>=0?"#34d399":"#f87171"}"/><text x="${(x+bw*.35).toFixed(1)}" y="${(v>=0?y-5:y+h+13).toFixed(1)}" font-size="11" fill="#e2e8f0" text-anchor="middle">${Math.round(v)}</text><text x="${(x+bw*.35).toFixed(1)}" y="${H-6}" font-size="10" fill="#94a3b8" text-anchor="middle">${labels[i]}</text>`;}).join("")}</svg>`;
}
function htmlBalancoSemanal(ws,lab){
 const cb=ws.filter(w=>w.defN>0);
 if(!cb.length)return `<div class="card"><h2>Balanço calórico</h2><p class="muted">Lance o que comeu e o total do Garmin de cada dia (a partir de ontem) e o balanço semanal aparece aqui, com a perda estimada comparada ao peso real.</p></div>`;
 let up=null;ws.forEach(w=>{w.dPeso=(w.peso&&up!==null)?+(w.peso-up).toFixed(1):null;if(w.peso)up=w.peso;});
 const totDef=cb.reduce((a,w)=>a+w.defTotal,0),totN=cb.reduce((a,w)=>a+w.defN,0);
 const defDia=Math.round(totDef/totN),est=+(totDef/KCAL_KG).toFixed(1);
 return `<div class="card"><h2>Balanço calórico</h2><div class="kpis">
  <div class="kpi"><div class="l">${defDia>=0?"Déficit":"Superávit"} médio por dia</div><div class="v ${defDia>0?"good":defDia<0?"badc":""}">${nf(Math.abs(defDia))} kcal</div><div class="l">${totN} dia(s) com consumo e gasto</div></div>
  <div class="kpi"><div class="l">Gordura estimada</div><div class="v ${est>0?"good":est<0?"badc":""}">${est>0?"−":est<0?"+":""}${Math.abs(est)} kg</div><div class="l">déficit acumulado ÷ ${nf(KCAL_KG)} kcal/kg</div></div></div>
  ${cb.length>1?`<div style="margin-top:10px">${barrasDiv(cb.slice(-8).map(w=>w.defMedio),cb.slice(-8).map(lab))}</div>`:""}
  <div class="scroll" style="margin-top:8px"><table><tr><th>Semana</th><th>Comeu</th><th>Gastou</th><th>Déf./dia</th><th>Perda est.</th><th>Peso Δ</th></tr>
  ${cb.slice().reverse().map(w=>`<tr><td>${lab(w)}<span class="muted" style="font-size:11px"> (${w.defN}d)</span></td><td>${nf(w.ing)}</td><td>${nf(w.gasto)}</td><td class="${w.defMedio>0?"good":"badc"}">${nf(w.defMedio)}</td><td>${w.perdaEst>0?"−":w.perdaEst<0?"+":""}${Math.abs(w.perdaEst)} kg</td><td class="${w.dPeso<0?"good":w.dPeso>0?"badc":""}">${w.dPeso===null?"–":(w.dPeso>0?"+":"")+w.dPeso}</td></tr>`).join("")}
  </table></div>
  <p class="muted" style="margin:8px 0 0">Perda est. = déficit ÷ 7.700 kcal por kg de gordura. É uma estimativa: compare com o Peso Δ real, que oscila com água e sal. Hoje não entra, porque o total do Garmin só fecha à meia-noite. "(5d)" = dias com consumo e gasto lançados.</p></div>`;
}
function vEvolucao(m,sub_){
 document.getElementById("hTitle").textContent="Evolução";sub_.textContent="Semana a semana (segunda a domingo)";
 const ws=semanas();
 if(!ws.length){m.innerHTML=`<div class="card"><h2>Ainda sem dados</h2><p class="muted">Registre na aba Hoje o peso (uma vez por semana), as calorias do Garmin e o check da dieta. A evolução aparece aqui semana a semana.</p></div>`+htmlComposicao();return;}
 const comPeso=ws.filter(w=>w.peso);
 const ini=comPeso[0], atu=comPeso[comPeso.length-1];
 const meta=+S.perfil.meta||null;
 const perdido=ini&&atu?+(ini.peso-atu.peso).toFixed(1):null;
 const nSem=ini&&atu?Math.max(1,Math.round((new Date(atu.seg)-new Date(ini.seg))/6048e5)):null;
 const ritmo=perdido!==null&&nSem?+(perdido/nSem).toFixed(2):null;
 const falta=meta&&atu?+(atu.peso-meta).toFixed(1):null;
 const prev=ritmo>0&&falta>0?Math.ceil(falta/ritmo):null;
 const lab=w=>w.seg.slice(8,10)+"/"+w.seg.slice(5,7);
 const ult8=ws.slice(-8);
 m.innerHTML=`
 <div class="card"><h2>Resumo</h2><div class="kpis">
  <div class="kpi"><div class="l">Peso atual</div><div class="v">${atu?atu.peso.toFixed(1)+" kg":"–"}</div></div>
  <div class="kpi"><div class="l">Desde o início (${ini?fmtD(ini.seg):"–"})</div><div class="v ${perdido>0?"good":perdido<0?"badc":""}">${perdido===null?"–":(perdido>0?"−":perdido<0?"+":"")+Math.abs(perdido)+" kg"}</div></div>
  <div class="kpi"><div class="l">Ritmo médio</div><div class="v">${ritmo===null||comPeso.length<2?"–":(ritmo>0?"−":"+")+Math.abs(ritmo)+" kg/sem"}</div></div>
  <div class="kpi"><div class="l">${meta?"Meta "+meta+" kg":"Meta de peso"}</div><div class="v">${meta?(falta>0?"faltam "+falta+" kg":"atingida 🎉"):`<button class="sm sec" onclick="view='config';render()">Definir</button>`}</div>${prev?`<div class="l">≈ ${prev} semanas no ritmo atual</div>`:""}</div>
 </div></div>
 ${comPeso.length>1?`<div class="card"><h2>Peso por semana</h2>${chart(comPeso.map(w=>[w.seg,w.peso]))}${meta?`<p class="muted" style="margin:4px 0 0">Meta: ${meta} kg</p>`:""}</div>`:""}
 ${htmlComposicao()}
 ${htmlBalancoSemanal(ws,lab)}
 ${ult8.some(w=>w.kcala)?`<div class="card"><h2>Calorias ativas por semana</h2>${barras(ult8.map(w=>w.kcala),ult8.map(lab),"#f59e0b")}<p class="muted" style="margin:4px 0 0">Soma das calorias ativas do Garmin em cada semana.</p></div>`:""}
 ${ult8.some(w=>w.adesao!==null)?`<div class="card"><h2>Adesão à dieta</h2>${barras(ult8.map(w=>w.adesao||0),ult8.map(lab),"#34d399")}<p class="muted" style="margin:4px 0 0">% das refeições feitas conforme o plano (média dos dias registrados).</p></div>`:""}
 <div class="card"><h2>Semanas</h2><div class="scroll"><table>
  <tr><th>Semana</th><th>Peso</th><th>Δ</th><th>kcal ativas</th><th>Dieta</th><th>Treinos</th></tr>
  ${ws.slice().reverse().map((w,i,arr)=>{const ant=arr.slice(i+1).find(x=>x.peso);const dl=w.peso&&ant?+(w.peso-ant.peso).toFixed(1):null;
   return `<tr><td>${lab(w)}</td><td>${w.peso?w.peso.toFixed(1):"–"}</td><td class="${dl<0?"good":dl>0?"badc":""}">${dl===null?"":(dl>0?"+":"")+dl}</td><td>${w.kcala?w.kcala.toLocaleString("pt-BR"):"–"}${w.kcalaDias&&w.kcalaDias<7?`<span class="muted" style="font-size:11px"> (${w.kcalaDias}d)</span>`:""}</td><td>${w.adesao===null?"–":w.adesao+"%"}</td><td>${w.treinos}/5</td></tr>`;}).join("")}
 </table></div>
 <p class="muted" style="margin:8px 0 0">Δ = variação de peso em relação à semana anterior com pesagem. "(4d)" indica quantos dias tiveram calorias lançadas.</p></div>
 ${ws.some(w=>w.cint)?`<div class="card"><h2>Cintura</h2>${chart(ws.filter(w=>w.cint).map(w=>[w.seg,w.cint]))}</div>`:""}`;
}

/* ============ CONFIG ============ */
function vConfig(m,sub_){document.getElementById("hTitle").textContent="Ajustes";sub_.textContent="";
 const n=S.logs.length,ne=Object.values(S.exames).reduce((a,e)=>a+Object.keys(e.hist).length,0);
 m.innerHTML=`<div class="card"><h2>Perfil e meta</h2><div class="grid3"><div><label>Nome</label><input id="p_nome" value="${esc(S.perfil.nome||"")}"></div><div><label>Altura (cm)</label><input id="p_alt" type="number" inputmode="numeric" value="${S.perfil.altura||""}"></div><div><label>Meta de peso (kg)</label><input id="p_meta" type="number" step="0.1" inputmode="decimal" value="${S.perfil.meta||""}"></div></div>
 <div class="grid2" style="margin-top:8px"><div><label>Nascimento</label><input id="p_nasc" type="date" value="${S.perfil.nasc||""}"></div><div><label>Sexo</label><select id="p_sexo"><option value="m" ${S.perfil.sexo!=="f"?"selected":""}>Masculino</option><option value="f" ${S.perfil.sexo==="f"?"selected":""}>Feminino</option></select></div></div>
 <p class="muted" style="margin:6px 0 0">Altura, nascimento e sexo servem só para estimar o metabolismo basal nos dias em que você não informa o total do Garmin.</p>
 <div class="row" style="margin-top:8px"><button onclick="salvarPerfil()">Salvar</button></div></div>
 <div class="card"><h2>Seus dados</h2><p class="muted">Tudo fica guardado neste iPhone, dentro do app (${n} treinos, ${ne} resultados de exame, ${Object.keys(S.diario).length} dias de registro) e se acumula com o tempo: é o seu histórico. Atualizar o app não apaga nada. O que apaga: remover o ícone da tela inicial ou limpar os dados do Safari. Por isso, faça backup toda semana (no dia da pesagem) e guarde o texto no app Notas ou mande para o seu e-mail.</p>
  <p class="muted">Último backup: <b>${S.ultimoBackup?fmtD(S.ultimoBackup.slice(0,10)):"nunca"}</b></p>
  <div class="row"><button onclick="S.ultimoBackup=new Date().toISOString();save();download('backup-saude-'+hoje()+'.json',JSON.stringify(S),'application/json')">Fazer backup</button><button class="sec" onclick="document.getElementById('imp').click()">Importar arquivo</button><input id="imp" type="file" accept=".json,application/json" class="hidden" onchange="importar(this)"></div>
  <label style="margin-top:10px">Ou cole o backup aqui</label><textarea id="imptxt" placeholder='{"exames":...}'></textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="importarTexto()">Importar texto colado</button></div></div>
 <div class="card"><h2>Instalar no iPhone</h2><ol class="muted" style="padding-left:18px;line-height:1.6"><li>Abra esta página no Safari.</li><li>Toque em Compartilhar (quadrado com seta).</li><li>"Adicionar à Tela de Início".</li></ol></div>
 <div class="card"><h2>Zona de perigo</h2><button class="danger" onclick="if(confirm('Apagar TODOS os dados deste aparelho?')){localStorage.removeItem(KEY);S=load();render()}">Apagar tudo</button></div>
 <p class="muted" style="text-align:center">Minha Saúde · v${APP_VERSION}</p>`;}
function importarTexto(){try{const s=JSON.parse(document.getElementById("imptxt").value);if(!s.exames)throw 0;S=norm(s);save();toast("Backup importado");render();}catch(e){toast("Texto inválido");}}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.exames)throw 0;S=norm(s);save();toast("Backup importado");render();}catch(e){toast("Arquivo inválido");}};r.readAsText(f);}

function salvarPerfil(){const g=id=>document.getElementById(id).value;S.perfil.nome=g("p_nome");S.perfil.altura=g("p_alt");S.perfil.meta=g("p_meta");S.perfil.nasc=g("p_nasc");S.perfil.sexo=g("p_sexo");save();toast("Salvo ✓");}
const mainEl=document.getElementById("main");
mainEl.addEventListener("input",e=>{if(view==="hoje"&&e.target.id&&e.target.id.startsWith("d_")){lerCampos();atualizarBalanco();}});
mainEl.addEventListener("change",e=>{if(view==="hoje"&&e.target.id&&e.target.id.startsWith("d_")){lerCampos();save();}});

render();
</script>
