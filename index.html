<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273449;--text:#e2e8f0;--muted:#94a3b8;--acc:#34d399;--acc2:#60a5fa;--warn:#fbbf24;--bad:#f87171;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid #1e293b;z-index:5}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
main{padding:14px 14px 0;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input,select,textarea{width:100%;background:#0b1220;color:var(--text);border:1px solid #334155;border-radius:10px;padding:10px;font-size:16px}
textarea{min-height:60px}
button{background:var(--acc);color:#052e22;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
button.sec{background:var(--card2);color:var(--text)}
button.sm{padding:6px 10px;font-size:13px}
button.danger{background:var(--bad);color:#2b0a0a}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);border-top:1px solid #1e293b;display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--muted);font-size:11px;padding:6px 0;border-radius:0;font-weight:500}
nav button span{display:block;font-size:22px;margin-bottom:2px}
nav button.on{color:var(--acc)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--card2);color:var(--muted)}
.pill.ok{background:#064e3b;color:#a7f3d0}.pill.hi{background:#7f1d1d;color:#fecaca}.pill.lo{background:#78350f;color:#fde68a}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--card2);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .t{font-weight:600}.item .s{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.big{font-size:28px;font-weight:700}
svg.chart{width:100%;height:140px;display:block}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid #334155;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.setrow{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{color:var(--muted);font-size:13px;text-align:center}
.chk{width:44px;height:40px;font-size:18px;padding:0}
.chk.done{background:var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#f1f5f9;color:#0f172a;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{white-space:nowrap}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{background:var(--card2);color:var(--text);width:40px;height:40px;border-radius:50%;padding:0;font-size:19px;font-weight:400}
#updbar{margin-top:8px;background:#064e3b;color:#a7f3d0;border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#updbar.hidden{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card2);border-radius:10px;padding:10px}
.kpi .v{font-size:22px;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
.good{color:var(--acc)}.badc{color:var(--bad)}
.alert{background:#78350f;color:#fde68a;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px}
.scroll{overflow-x:auto}
</style>
</head>

<div id="updbar" class="hidden">Nova versão do app disponível <button class="sm" onclick="atualizar()">Atualizar</button></div></header>

/* ============ ESTADO ============ */
const KEY="saude.v1";
let S = load();
function load(){
 try{const s=JSON.parse(localStorage.getItem(KEY)); if(s) return s;}catch(e){}
 return {exames:JSON.parse(JSON.stringify(SEED_EXAMES)),diario:{},logs:[],cargas:{},perfil:{nome:"",nasc:"",altura:""}};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("Não consegui salvar no aparelho");} }
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
const hoje=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>{const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ VERSÃO / ATUALIZAÇÃO ============ */
const APP_VERSION="0.4";
function atualizar(){ // recarrega ignorando o cache do Safari
 toast("Atualizando…");
 const u=location.pathname+"?v="+Date.now()+location.hash;
 fetch(u,{cache:"reload"}).catch(()=>{}).finally(()=>location.replace(u));
}
async function checarVersao(){
 try{const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});const t=await r.text();
  const m=t.match(/const APP_VERSION="([^"]+)"/);
  if(m&&m[1]!==APP_VERSION)document.getElementById("updbar").classList.remove("hidden");}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checarVersao();});
if(location.protocol.startsWith("http"))setTimeout(checarVersao,1500);

/* ============ DATAS ============ */
let diaSel=hoje();
const addDias=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const segunda=d=>{const x=new Date(d+"T12:00:00");const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x.toISOString().slice(0,10);};
const diaSemana=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"});
function dia(d){return S.diario[d]=S.diario[d]||{};}
function adesao(x){if(!x||!x.ref)return null;const n=Object.values(x.ref).filter(Boolean).length;return n?Math.round(n/DIETA.length*100):(x.dietaOk?100:null);}

/* ============ NAVEGAÇÃO ============ */
let view="hoje", sub=null;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;sub=null;render();});
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 const m=document.getElementById("main");
 const sub_=document.getElementById("hSub");
 ({hoje:vHoje,evolucao:vEvolucao,treinos:vTreinos,exames:vExames,dieta:vDieta,config:vConfig})[view](m,sub_);
 window.scrollTo(0,0);
}

/* ============ HOJE / DIÁRIO ============ */

 const ehHoje=diaSel===hoje();
 document.getElementById("hTitle").textContent=ehHoje?"Hoje":"Registro";
 sub_.textContent=new Date(diaSel+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
 const d=S.diario[diaSel]||{};
 const dias=Object.keys(S.diario).sort();
 const wd=new Date(diaSel+"T12:00:00").getDay(); const tr=TREINOS[[null,0,1,2,3,4,null][wd]];
 const treinou=S.logs.some(l=>l.data===diaSel);
 const ad=adesao(d);
 // pesagem da semana pendente?
 const sem=segunda(hoje()); const pesouSemana=dias.some(k=>k>=sem&&k<=hoje()&&S.diario[k].peso);
 const diasBkp=S.ultimoBackup?Math.floor((Date.now()-new Date(S.ultimoBackup).getTime())/864e5):null;

/* ============ GRÁFICO SVG ============ */
function chart(pts,ref){ // pts: [[date,val]]; ref:[min,max]
 const W=600,H=140,p=28;
 const xs=pts.map(a=>new Date(a[0]).getTime()), ys=pts.map(a=>a[1]);
 let lo=Math.min(...ys),hi=Math.max(...ys);
 if(ref){if(ref[0]!=null)lo=Math.min(lo,ref[0]);if(ref[1]!=null)hi=Math.max(hi,ref[1]);}
 if(hi===lo){hi+=1;lo-=1;} const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
 const x0=Math.min(...xs),x1=Math.max(...xs)||1;
 const X=t=>xs.length>1?p+(t-x0)/(x1-x0)*(W-2*p):W/2, Y=v=>H-p+ (lo-v)/(hi-lo)*(H-2*p)*-1 - (H-2*p);
 const Yv=v=>p+(hi-v)/(hi-lo)*(H-2*p);
 let band="";
 if(ref){const a=ref[0]!=null?Yv(ref[0]):H-p, b=ref[1]!=null?Yv(ref[1]):p; band=`<rect x="${p}" y="${Math.min(a,b)}" width="${W-2*p}" height="${Math.abs(a-b)}" fill="#34d399" opacity=".12"/>`;}
 const path=pts.map((a,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Yv(ys[i]).toFixed(1)).join(" ");
 const dots=pts.map((a,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Yv(ys[i]).toFixed(1)}" r="4" fill="${ref&&fora(ys[i],ref)?"#f87171":"#60a5fa"}"/><text x="${X(xs[i]).toFixed(1)}" y="${(Yv(ys[i])-9).toFixed(1)}" font-size="11" fill="#e2e8f0" text-anchor="middle">${ys[i]}</text>`).join("");
 const lbl=pts.map((a,i)=>(i===0||i===pts.length-1)?`<text x="${X(xs[i]).toFixed(1)}" y="${H-6}" font-size="10" fill="#94a3b8" text-anchor="${i===0?"start":"end"}">${a[0].slice(0,7).split("-").reverse().join("/")}</text>`:"").join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${band}<path d="${path}" fill="none" stroke="#60a5fa" stroke-width="2"/>${dots}${lbl}</svg>`;
}
function fora(v,ref){return (ref[0]!=null&&v<ref[0])||(ref[1]!=null&&v>ref[1]);}
function status(v,ref){if(!ref)return "";if(ref[0]!=null&&v<ref[0])return "lo";if(ref[1]!=null&&v>ref[1])return "hi";return "ok";}

function exportGarmin(id){
 const t=TREINOS.find(x=>x.id===id);
 const ST={interval:{stepTypeId:3,stepTypeKey:"interval",displayOrder:3},rest:{stepTypeId:5,stepTypeKey:"rest",displayOrder:5},repeat:{stepTypeId:6,stepTypeKey:"repeat",displayOrder:6}};
 const EC={reps:{conditionTypeId:10,conditionTypeKey:"reps",displayOrder:10,displayable:true},time:{conditionTypeId:2,conditionTypeKey:"time",displayOrder:2,displayable:true},iter:{conditionTypeId:7,conditionTypeKey:"iterations",displayOrder:7,displayable:false}};
 const base=()=>({childStepId:1,preferredEndConditionUnit:null,endConditionCompare:null,targetValueOne:null,targetValueTwo:null,targetValueUnit:null,zoneNumber:null,secondaryTargetType:null,secondaryTargetValueOne:null,secondaryTargetValueTwo:null,secondaryTargetValueUnit:null,secondaryZoneNumber:null,endConditionZone:null,strokeType:{strokeTypeId:0,strokeTypeKey:null,displayOrder:0},equipmentType:{equipmentTypeId:0,equipmentTypeKey:null,displayOrder:0},workoutProvider:null,providerExerciseSourceId:null,weightValue:null});
 let order=1,gid=30000000000,k=0;const steps=[];
 t.blocos.forEach(b=>{k++;const g={type:"RepeatGroupDTO",stepId:gid+order,stepOrder:order++,stepType:ST.repeat,childStepId:k,numberOfIterations:b.x,endConditionValue:b.x,preferredEndConditionUnit:null,endConditionCompare:null,endCondition:EC.iter,skipLastRestStep:true,smartRepeat:false,workoutSteps:[]};
  let j=0;b.ex.forEach(e=>{j++;g.workoutSteps.push(Object.assign(base(),{type:"ExecutableStepDTO",stepId:gid+order,stepOrder:order++,childStepId:k,stepType:ST.interval,description:e[0],endCondition:e[4]?EC.time:EC.reps,endConditionValue:e[4]?e[4]:e[3],targetType:{workoutTargetTypeId:1,workoutTargetTypeKey:"no.target",displayOrder:1},category:e[1],exerciseName:e[2],weightUnit:{unitId:8,unitKey:"kilogram",factor:1000}}));});
  j++;g.workoutSteps.push(Object.assign(base(),{type:"ExecutableStepDTO",stepId:gid+order,stepOrder:order++,childStepId:k,stepType:ST.rest,description:"Descanso "+b.r+"s",endCondition:EC.time,endConditionValue:b.r,targetType:null,category:null,exerciseName:null,weightUnit:null}));
  steps.push(g);});
 const sport={sportTypeId:5,sportTypeKey:"strength_training",displayOrder:5};
 const w={workoutId:null,ownerId:null,workoutName:t.nome,description:t.desc,updatedDate:null,createdDate:null,sportType:sport,subSportType:null,trainingPlanId:null,author:null,sharedWithUsers:null,estimatedDurationInSecs:3600,estimatedDistanceInMeters:null,poolLength:null,poolLengthUnit:null,locale:null,workoutProvider:null,workoutSourceId:null,uploadTimestamp:null,atpPlanId:null,consumer:null,consumerName:null,consumerImageURL:null,consumerWebsiteURL:null,workoutNameI18nKey:null,descriptionI18nKey:null,avgTrainingSpeed:0,estimateType:null,estimatedDistanceUnit:{unitId:null,unitKey:null,factor:null},workoutThumbnailUrl:null,isSessionTransitionEnabled:null,shared:false,
  workoutSegments:[{segmentOrder:1,sportType:sport,poolLengthUnit:null,poolLength:null,avgTrainingSpeed:null,estimatedDurationInSecs:null,estimatedDistanceInMeters:null,estimatedDistanceUnit:null,estimateType:null,description:t.nome,workoutSteps:steps}]};
 download(`garmin_${t.id}.json`,JSON.stringify(w),"application/json");
}
function download(name,txt,type){ // mostra o conteúdo com botão Copiar (download direto não funciona em todos os navegadores)
 let box=document.getElementById("dlbox");if(!box){box=document.createElement("div");box.id="dlbox";box.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end";document.body.appendChild(box);}
 box.innerHTML=`<div class="card" style="width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;margin:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))"><h2>${esc(name)}</h2><p class="muted">Toque em Copiar e cole num arquivo com este nome (ou envie para si mesmo). Para o Garmin: salve como .json e importe no Garmin Connect.</p><textarea id="dltxt" style="min-height:120px;font-size:12px;font-family:monospace">${esc(txt)}</textarea><div class="row" style="margin-top:10px">${navigator.share?`<button id="dlshare">Salvar / Enviar</button>`:""}<button id="dlcopy" class="${navigator.share?"sec":""}">Copiar</button><button class="sec" onclick="document.getElementById('dlbox').remove()">Fechar</button></div></div>`;
 const sh=document.getElementById("dlshare");
 if(sh)sh.onclick=async()=>{try{const f=new File([txt],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else await navigator.share({title:name,text:txt});}catch(e){if(e.name!=="AbortError")toast("Não deu para compartilhar; use Copiar");}};
 document.getElementById("dlcopy").onclick=async()=>{const ta=document.getElementById("dltxt");try{await navigator.clipboard.writeText(txt);toast("Copiado");}catch(e){ta.focus();ta.select();try{document.execCommand("copy");toast("Copiado");}catch(e2){toast("Selecione o texto e copie manualmente");}}};
}

/* ============ DIETA ============ */
function vDieta(m,sub_){document.getElementById("hTitle").textContent="Dieta";sub_.textContent="Plano da nutricionista · "+(diaSel===hoje()?"hoje":fmtD(diaSel));
 const d=S.diario[diaSel]||{};const chk=d.ref||{};const ad=adesao(d);
 m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="t" style="font-weight:600">${diaSel===hoje()?"Hoje":diaSemana(diaSel)}</div><div class="muted">Toque no ✓ de cada refeição feita conforme o plano</div></div><span class="pill ${ad===100?"ok":ad>=50?"lo":ad===null?"":"hi"}">${ad===null?"–":ad+"%"}</span></div></div>`+
 DIETA.map((r,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(r.ref)} ${r.hora?`<span class="muted" style="font-weight:400;font-size:13px">${r.hora}</span>`:""}</h2><button class="chk ${chk[i]?"done":"sec"}" onclick="marcarRef(${i})">${chk[i]?"✓":""}</button></div><ul style="margin:8px 0 0;padding-left:18px;line-height:1.5">${r.itens.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")+
 `<div class="card"><h2>Água e extras</h2><div class="grid2"><div><label>Água (copos)</label><input type="number" inputmode="numeric" value="${d.agua||""}" onchange="dia(diaSel).agua=this.value;save();toast('Salvo')"></div><div><label>Fora do plano?</label><input value="${esc(d.extra||"")}" placeholder="ex.: 1 brigadeiro" onchange="dia(diaSel).extra=this.value;save();toast('Salvo')"></div></div></div>`;}
function marcarRef(i){if(view==="hoje")lerCampos();const d=dia(diaSel);d.ref=d.ref||{};d.ref[i]=!d.ref[i];save();render();}

/* ============ EVOLUÇÃO ============ */
function semanas(){
 const ks=new Set();Object.keys(S.diario).forEach(k=>ks.add(segunda(k)));S.logs.forEach(l=>ks.add(segunda(l.data)));
 return [...ks].sort().map(seg=>{
  const fim=addDias(seg,6);const ds=Object.keys(S.diario).filter(k=>k>=seg&&k<=fim).sort();
  const xs=ds.map(k=>S.diario[k]);
  const pesos=ds.filter(k=>+S.diario[k].peso).map(k=>+S.diario[k].peso);
  const soma=f=>xs.reduce((a,x)=>a+(+x[f]||0),0), cnt=f=>xs.filter(x=>+x[f]).length;
  const ads=xs.map(adesao).filter(a=>a!==null);
  const cint=ds.filter(k=>+S.diario[k].cint).map(k=>+S.diario[k].cint);
  return {seg,fim,peso:pesos.length?pesos[pesos.length-1]:null,cint:cint.length?cint[cint.length-1]:null,
   kcal:soma("kcal"),kcalDias:cnt("kcal"),kcala:soma("kcala"),kcalaDias:cnt("kcala"),passos:soma("passos"),passosDias:cnt("passos"),
   adesao:ads.length?Math.round(ads.reduce((a,b)=>a+b,0)/ads.length):null,diasDieta:ads.length,
   treinos:S.logs.filter(l=>l.data>=seg&&l.data<=fim).length,
   sono:cnt("sono")?(soma("sono")/cnt("sono")).toFixed(1):null};
 });
}
function barras(vals,labels,cor){
 const W=600,H=140,p=24,max=Math.max(...vals,1),bw=(W-2*p)/vals.length;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${vals.map((v,i)=>{const h=(H-2*p)*v/max;const x=p+i*bw+bw*.15;return `<rect x="${x.toFixed(1)}" y="${(H-p-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${cor}"/>${v?`<text x="${(x+bw*.35).toFixed(1)}" y="${(H-p-h-5).toFixed(1)}" font-size="11" fill="#e2e8f0" text-anchor="middle">${v>=1000?(v/1000).toFixed(1)+"k":v}</text>`:""}<text x="${(x+bw*.35).toFixed(1)}" y="${H-7}" font-size="10" fill="#94a3b8" text-anchor="middle">${labels[i]}</text>`;}).join("")}</svg>`;
}
function vEvolucao(m,sub_){
 document.getElementById("hTitle").textContent="Evolução";sub_.textContent="Semana a semana (segunda a domingo)";
 const ws=semanas();
 if(!ws.length){m.innerHTML=`<div class="card"><h2>Ainda sem dados</h2><p class="muted">Registre na aba Hoje o peso (uma vez por semana), as calorias do Garmin e o check da dieta. A evolução aparece aqui semana a semana.</p></div>`;return;}
 const comPeso=ws.filter(w=>w.peso);
 const ini=comPeso[0], atu=comPeso[comPeso.length-1];
 const meta=+S.perfil.meta||null;
 const perdido=ini&&atu?+(ini.peso-atu.peso).toFixed(1):null;
 const nSem=ini&&atu?Math.max(1,Math.round((new Date(atu.seg)-new Date(ini.seg))/6048e5)):null;
 const ritmo=perdido!==null&&nSem?+(perdido/nSem).toFixed(2):null;
 const falta=meta&&atu?+(atu.peso-meta).toFixed(1):null;
 const prev=ritmo>0&&falta>0?Math.ceil(falta/ritmo):null;
 const lab=w=>w.seg.slice(8,10)+"/"+w.seg.slice(5,7);
 const ult8=ws.slice(-8);
 m.innerHTML=`
 <div class="card"><h2>Resumo</h2><div class="kpis">
  <div class="kpi"><div class="l">Peso atual</div><div class="v">${atu?atu.peso.toFixed(1)+" kg":"–"}</div></div>
  <div class="kpi"><div class="l">Desde o início (${ini?fmtD(ini.seg):"–"})</div><div class="v ${perdido>0?"good":perdido<0?"badc":""}">${perdido===null?"–":(perdido>0?"−":perdido<0?"+":"")+Math.abs(perdido)+" kg"}</div></div>
  <div class="kpi"><div class="l">Ritmo médio</div><div class="v">${ritmo===null||comPeso.length<2?"–":(ritmo>0?"−":"+")+Math.abs(ritmo)+" kg/sem"}</div></div>
  <div class="kpi"><div class="l">${meta?"Meta "+meta+" kg":"Meta de peso"}</div><div class="v">${meta?(falta>0?"faltam "+falta+" kg":"atingida 🎉"):`<button class="sm sec" onclick="view='config';render()">Definir</button>`}</div>${prev?`<div class="l">≈ ${prev} semanas no ritmo atual</div>`:""}</div>
 </div></div>
 ${comPeso.length>1?`<div class="card"><h2>Peso por semana</h2>${chart(comPeso.map(w=>[w.seg,w.peso]))}${meta?`<p class="muted" style="margin:4px 0 0">Meta: ${meta} kg</p>`:""}</div>`:""}
 ${ult8.some(w=>w.kcala)?`<div class="card"><h2>Calorias ativas por semana</h2>${barras(ult8.map(w=>w.kcala),ult8.map(lab),"#f59e0b")}<p class="muted" style="margin:4px 0 0">Soma das calorias ativas do Garmin em cada semana.</p></div>`:""}
 ${ult8.some(w=>w.adesao!==null)?`<div class="card"><h2>Adesão à dieta</h2>${barras(ult8.map(w=>w.adesao||0),ult8.map(lab),"#34d399")}<p class="muted" style="margin:4px 0 0">% das refeições feitas conforme o plano (média dos dias registrados).</p></div>`:""}
 <div class="card"><h2>Semanas</h2><div class="scroll"><table>
  <tr><th>Semana</th><th>Peso</th><th>Δ</th><th>kcal ativas</th><th>Dieta</th><th>Treinos</th></tr>
  ${ws.slice().reverse().map((w,i,arr)=>{const ant=arr.slice(i+1).find(x=>x.peso);const dl=w.peso&&ant?+(w.peso-ant.peso).toFixed(1):null;
   return `<tr><td>${lab(w)}</td><td>${w.peso?w.peso.toFixed(1):"–"}</td><td class="${dl<0?"good":dl>0?"badc":""}">${dl===null?"":(dl>0?"+":"")+dl}</td><td>${w.kcala?w.kcala.toLocaleString("pt-BR"):"–"}${w.kcalaDias&&w.kcalaDias<7?`<span class="muted" style="font-size:11px"> (${w.kcalaDias}d)</span>`:""}</td><td>${w.adesao===null?"–":w.adesao+"%"}</td><td>${w.treinos}/5</td></tr>`;}).join("")}
 </table></div>
 <p class="muted" style="margin:8px 0 0">Δ = variação de peso em relação à semana anterior com pesagem. "(4d)" indica quantos dias tiveram calorias lançadas.</p></div>
 ${ws.some(w=>w.cint)?`<div class="card"><h2>Cintura</h2>${chart(ws.filter(w=>w.cint).map(w=>[w.seg,w.cint]))}</div>`:""}`;
}

/* ============ CONFIG ============ */
function vConfig(m,sub_){document.getElementById("hTitle").textContent="Ajustes";sub_.textContent="";
 const n=S.logs.length,ne=Object.values(S.exames).reduce((a,e)=>a+Object.keys(e.hist).length,0);
 m.innerHTML=`<div class="card"><h2>Perfil e meta</h2><div class="grid3"><div><label>Nome</label><input id="p_nome" value="${esc(S.perfil.nome||"")}"></div><div><label>Altura (cm)</label><input id="p_alt" type="number" inputmode="numeric" value="${S.perfil.altura||""}"></div><div><label>Meta de peso (kg)</label><input id="p_meta" type="number" step="0.1" inputmode="decimal" value="${S.perfil.meta||""}"></div></div><div class="row" style="margin-top:8px"><button onclick="S.perfil.nome=document.getElementById('p_nome').value;S.perfil.altura=document.getElementById('p_alt').value;S.perfil.meta=document.getElementById('p_meta').value;save();toast('Salvo')">Salvar</button></div></div>
 <div class="card"><h2>Seus dados</h2><p class="muted">Tudo fica guardado neste iPhone, dentro do app (${n} treinos, ${ne} resultados de exame, ${Object.keys(S.diario).length} dias de registro) e se acumula com o tempo: é o seu histórico. Atualizar o app não apaga nada. O que apaga: remover o ícone da tela inicial ou limpar os dados do Safari. Por isso, faça backup toda semana (no dia da pesagem) e guarde o texto no app Notas ou mande para o seu e-mail.</p>
  <p class="muted">Último backup: <b>${S.ultimoBackup?fmtD(S.ultimoBackup.slice(0,10)):"nunca"}</b></p>
  <div class="row"><button onclick="S.ultimoBackup=new Date().toISOString();save();download('backup-saude-'+hoje()+'.json',JSON.stringify(S),'application/json')">Fazer backup</button><button class="sec" onclick="document.getElementById('imp').click()">Importar arquivo</button><input id="imp" type="file" accept=".json,application/json" class="hidden" onchange="importar(this)"></div>
  <label style="margin-top:10px">Ou cole o backup aqui</label><textarea id="imptxt" placeholder='{"exames":...}'></textarea><div class="row" style="margin-top:8px"><button class="sec" onclick="importarTexto()">Importar texto colado</button></div></div>
 <div class="card"><h2>Instalar no iPhone</h2><ol class="muted" style="padding-left:18px;line-height:1.6"><li>Abra esta página no Safari.</li><li>Toque em Compartilhar (quadrado com seta).</li><li>"Adicionar à Tela de Início".</li></ol></div>
 <div class="card"><h2>Zona de perigo</h2><button class="danger" onclick="if(confirm('Apagar TODOS os dados deste aparelho?')){localStorage.removeItem(KEY);S=load();render()}">Apagar tudo</button></div>
 <p class="muted" style="text-align:center">Minha Saúde · v${APP_VERSION}</p>`;}
function importarTexto(){try{const s=JSON.parse(document.getElementById("imptxt").value);if(!s.exames)throw 0;S=s;save();toast("Backup importado");render();}catch(e){toast("Texto inválido");}}
function importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.exames)throw 0;S=s;save();toast("Backup importado");render();}catch(e){toast("Arquivo inválido");}};r.readAsText(f);}

render();
</script>
